name: service-ocr

on:
  workflow_call:

jobs:
  service-ocr-build:
    runs-on: docker
    container: container.rori.dev/ci/golang:1.27
    defaults:
      run:
        working-directory: service-ocr
    steps:
      - name: checkout
        uses: actions/checkout@main
      - run: |
          go mod download
          make build.dryrun
      - run: |
          ls ~/.cache/go-build || true
          ls /go/pkg/mod || true
      - uses: https://github.com/actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

  service-ocr-format:
    needs: service-ocr-build
    runs-on: docker
    container: container.rori.dev/ci/golang:1.27
    defaults:
      run:
        working-directory: service-ocr
    steps:
      - name: checkout
        uses: actions/checkout@main
      - uses: https://github.com/actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make format.check

  service-ocr-lint:
    needs: service-ocr-build
    runs-on: docker
    container: container.rori.dev/ci/golang:1.27
    defaults:
      run:
        working-directory: service-ocr
    steps:
      - name: checkout
        uses: actions/checkout@main
      - uses: https://github.com/actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make lint

  service-ocr-test:
    needs: service-ocr-build
    runs-on: docker
    container: container.rori.dev/ci/golang:1.27
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      CGO_ENABLED: 0
    defaults:
      run:
        working-directory: service-ocr
    steps:
      - name: checkout
        uses: actions/checkout@main
      - uses: https://github.com/actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - run: make test

  service-ocr-vulnerabilities-code:
    needs: service-ocr-build
    runs-on: docker
    container: container.rori.dev/ci/trivy
    defaults:
      run:
        working-directory: service-ocr
    steps:
      - name: checkout
        uses: actions/checkout@main
      - run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --skip-db-update --skip-java-db-update --skip-check-update .

  service-ocr-build-container:
    if: forgejo.ref == 'refs/heads/main'
    needs:
      - service-ocr-build
      - service-ocr-format
      - service-ocr-lint
      - service-ocr-test
      - service-ocr-vulnerabilities-code
    runs-on: docker
    container: container.rori.dev/ci/buildah
    steps:
      - name: checkout
        uses: actions/checkout@main
      - uses: https://github.com/actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: build container
        uses: actions/build-container@main
        with:
          tag: ${{ secrets.CONTAINER_REGISTRY_HOST }}/lunchbox/ocr:latest
          context: service-ocr
          push: true
          registry: ${{ secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ secrets.CONTAINER_REGISTRY_USER }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
