name: lunchbox CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    uses: ./.forgejo/workflows/frontend.yaml
    secrets: inherit

  backend:
    uses: ./.forgejo/workflows/backend.yaml
    secrets: inherit

  service-ocr:
    uses: ./.forgejo/workflows/service-ocr.yaml
    secrets: inherit

  deploy:
    if: forgejo.ref == 'refs/heads/main'
    needs: [frontend, backend, service-ocr]
    uses: ./.forgejo/workflows/deploy.yaml
    secrets: inherit
